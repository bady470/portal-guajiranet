name: Build and publish Docker images

on:
  push:
    branches: [develop]
    tags:
      - 'v*.*.*'
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - '.github/workflows/build-publish-images.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag adicional para las imágenes, por ejemplo v0.1.0-rc.1'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/bady470

jobs:
  build-publish:
    name: Build and publish backend/frontend images
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: pwsh
        run: |
          $shortSha = "${env:GITHUB_SHA}".Substring(0, 7)
          "SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ("${{ inputs.release_tag }}" -ne "") {
            "RELEASE_TAG=${{ inputs.release_tag }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } elseif ("${env:GITHUB_REF}" -like "refs/tags/*") {
            "RELEASE_TAG=${env:GITHUB_REF_NAME}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "RELEASE_TAG=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/portal-guajiranet-backend:sha-${{ steps.meta.outputs.SHORT_SHA }}
            ${{ env.IMAGE_NAMESPACE }}/portal-guajiranet-backend:${{ steps.meta.outputs.RELEASE_TAG || 'develop' }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/portal-guajiranet-frontend:sha-${{ steps.meta.outputs.SHORT_SHA }}
            ${{ env.IMAGE_NAMESPACE }}/portal-guajiranet-frontend:${{ steps.meta.outputs.RELEASE_TAG || 'develop' }}
