name: CI Mobile

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ci-mobile.yml'

permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-analyze-test:
    name: Mobile format, analysis and tests
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter stable
        shell: pwsh
        run: |
          $flutterRoot = Join-Path $env:RUNNER_TOOL_CACHE "flutter-stable"
          if (-not (Test-Path (Join-Path $flutterRoot "bin\flutter.bat"))) {
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git $flutterRoot
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $flutterRoot "bin")
          & (Join-Path $flutterRoot "bin\flutter.bat") --version

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test
