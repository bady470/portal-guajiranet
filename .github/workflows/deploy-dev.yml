name: Deploy DEV

on:
  workflow_run:
    workflows: ["Build and publish Docker images"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de imágenes a desplegar"
        required: true
        default: "develop"
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/bady470
  COMPOSE_FILE: infra/docker/docker-compose.dev.yml

jobs:
  deploy:
    name: Deploy DEV
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.name == 'Build and publish Docker images')
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select image tag
        id: meta
        shell: powershell
        run: |
          if ('${{ inputs.image_tag }}' -ne '') {
            "IMAGE_TAG=${{ inputs.image_tag }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "IMAGE_TAG=develop" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy DEV with Docker Compose
        shell: powershell
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_NAMESPACE }}/portal-guajiranet-backend:${{ steps.meta.outputs.IMAGE_TAG }}
          FRONTEND_IMAGE: ${{ env.IMAGE_NAMESPACE }}/portal-guajiranet-frontend:${{ steps.meta.outputs.IMAGE_TAG }}
          SPRING_PROFILES_ACTIVE: dev
          BACKEND_PORT: "8080"
          FRONTEND_PORT: "4200"
        run: |
          docker compose -f $env:COMPOSE_FILE down --remove-orphans
          docker compose -f $env:COMPOSE_FILE pull
          docker compose -f $env:COMPOSE_FILE up -d --remove-orphans
          docker compose -f $env:COMPOSE_FILE ps
          if ($LASTEXITCODE -ne 0) { throw 'El despliegue DEV falló' }

      - name: Verify DEV health
        shell: powershell
        env:
          COMPOSE_FILE: infra/docker/docker-compose.dev.yml
        run: |
          $deadline = (Get-Date).AddMinutes(3)
          do {
            $state = docker compose -f $env:COMPOSE_FILE ps --format json | Out-String
            Write-Host $state
            if ($state -match 'healthy') { exit 0 }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt $deadline)
          docker compose -f $env:COMPOSE_FILE logs --no-color --tail=100
          throw 'DEV no alcanzó un estado saludable dentro del tiempo esperado'
