name: Deploy PROD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag inmutable de imágenes a desplegar"
        required: true
        type: string
      previous_tag:
        description: "Tag anterior para rollback si el despliegue falla"
        required: false
        type: string

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/bady470
  COMPOSE_FILE: infra/docker/docker-compose.prod.yml

jobs:
  deploy:
    name: Deploy PROD
    environment: prod
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy PROD
        shell: powershell
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_NAMESPACE }}/portal-guajiranet-backend:${{ inputs.image_tag }}
          FRONTEND_IMAGE: ${{ env.IMAGE_NAMESPACE }}/portal-guajiranet-frontend:${{ inputs.image_tag }}
          SPRING_PROFILES_ACTIVE: prod
          BACKEND_PORT: "8080"
          FRONTEND_PORT: "80"
        run: |
          "BACKEND_IMAGE=$env:BACKEND_IMAGE`nFRONTEND_IMAGE=$env:FRONTEND_IMAGE`nSPRING_PROFILES_ACTIVE=$env:SPRING_PROFILES_ACTIVE`nBACKEND_PORT=$env:BACKEND_PORT`nFRONTEND_PORT=$env:FRONTEND_PORT" | Set-Content infra/docker/.env -Encoding utf8
          docker compose -f $env:COMPOSE_FILE config
          docker compose -f $env:COMPOSE_FILE down --remove-orphans
          docker compose -f $env:COMPOSE_FILE pull
          docker compose -f $env:COMPOSE_FILE up -d --remove-orphans
          if ($LASTEXITCODE -ne 0) { throw 'El despliegue PROD falló' }

      - name: Verify PROD health
        shell: powershell
        run: |
          Start-Sleep -Seconds 20
          docker compose -f $env:COMPOSE_FILE ps
          $state = docker compose -f $env:COMPOSE_FILE ps --format json | Out-String
          if ($state -notmatch 'healthy') {
            docker compose -f $env:COMPOSE_FILE logs --no-color --tail=100
            throw 'PROD no alcanzó un estado saludable'
          }

      - name: Rollback PROD on failure
        if: failure() && inputs.previous_tag != ''
        shell: powershell
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_NAMESPACE }}/portal-guajiranet-backend:${{ inputs.previous_tag }}
          FRONTEND_IMAGE: ${{ env.IMAGE_NAMESPACE }}/portal-guajiranet-frontend:${{ inputs.previous_tag }}
          SPRING_PROFILES_ACTIVE: prod
          BACKEND_PORT: "8080"
          FRONTEND_PORT: "80"
        run: |
          "BACKEND_IMAGE=$env:BACKEND_IMAGE`nFRONTEND_IMAGE=$env:FRONTEND_IMAGE`nSPRING_PROFILES_ACTIVE=$env:SPRING_PROFILES_ACTIVE`nBACKEND_PORT=$env:BACKEND_PORT`nFRONTEND_PORT=$env:FRONTEND_PORT" | Set-Content infra/docker/.env -Encoding utf8
          docker compose -f $env:COMPOSE_FILE down --remove-orphans
          docker compose -f $env:COMPOSE_FILE pull
          docker compose -f $env:COMPOSE_FILE up -d --remove-orphans
