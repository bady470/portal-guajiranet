name: portal-guajiranet-prod

services:
  backend:
    image: ${BACKEND_IMAGE:?Define BACKEND_IMAGE con un tag inmutable}
    container_name: portal-backend-prod
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - portalnet-prod
    restart: always
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 60s

  frontend:
    image: ${FRONTEND_IMAGE:?Define FRONTEND_IMAGE con un tag inmutable}
    container_name: portal-frontend-prod
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - portalnet-prod
    restart: always
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s

networks:
  portalnet-prod:
    name: portalnet-prod
    driver: bridge
